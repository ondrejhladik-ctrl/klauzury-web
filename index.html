<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ondřej Hladík</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=EB+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- custom cursor -->
<div id="cur">
  <div class="ring">
    <!-- 3D ikony: rastr z assets/ico-*.svg v husté sadě vrstev (vytváří JS), otáčejí se kolem svislé osy -->
    <div class="ico-wrap ico-play"><div class="ico" data-src="assets/ico-play.svg"></div></div>
    <div class="ico-wrap ico-pause"><div class="ico" data-src="assets/ico-pause.svg"></div></div>
    <!-- náhrada, když se SVG nenačte -->
    <svg class="ico-play"  viewBox="0 0 100 100"><path d="M15 8 L87 50 L15 92 Z" fill="none" stroke="white" stroke-width="14" stroke-linejoin="round"/></svg>
    <svg class="ico-pause" viewBox="0 0 100 100"><rect x="20" y="10" width="24" height="80" fill="none" stroke="white" stroke-width="12" stroke-linejoin="round"/><rect x="56" y="10" width="24" height="80" fill="none" stroke="white" stroke-width="12" stroke-linejoin="round"/></svg>
  </div>
</div>

<!-- cutscéna po spuštění kazety: tma -> obličej otevírá oči -> otevřená kazeta -->
<div id="cut" aria-hidden="true"><canvas id="cut-face"></canvas><canvas id="cut-case"></canvas></div>

<!-- fold overlay -->
<div id="fold-overlay">
  <img id="fold-img" src="" alt="">
</div>

<!-- otazník vpravo nahoře = odkaz na explikaci, stejný styl jako šipka -->
<a class="name name-link" id="qlink" href="explikace.html" aria-label="Explikace">
  <canvas id="qdith" aria-hidden="true"></canvas>
</a>
<!-- kruh pod otazníkem: jen když kazeta hraje; klik otevře lišty efektů -->
<button id="fxbtn" type="button" aria-label="Efekty" aria-expanded="false">
  <canvas id="fxdith" aria-hidden="true"></canvas>
</button>

<!-- svislé lišty efektů: vlevo hlasitost + basy, vpravo rezonance + drive -->
<div id="fx" aria-hidden="true">
  <div class="fx-side fx-left">
    <div class="fx-slider" data-fx="volume"><canvas></canvas><span>VOL</span></div>
    <div class="fx-slider" data-fx="bass"><canvas></canvas><span>BASS</span></div>
  </div>
  <div class="fx-side fx-right">
    <div class="fx-slider" data-fx="reso"><canvas></canvas><span>RESO</span></div>
    <div class="fx-slider" data-fx="drive"><canvas></canvas><span>DRIVE</span></div>
  </div>
</div>

<!-- hero -->
<section id="hero">
  <!-- obří CLICK v pozadí — objeví se, když je kurzor nad šipkou nebo otazníkem -->
  <canvas id="click-bg" aria-hidden="true"></canvas>
  <div id="cstage">
    <div id="cwrap" role="img" aria-label="Bezedné noci — kazeta">
      <img id="cimg" src="assets/case-cover.jpg" alt="">
      <canvas id="cdith" aria-hidden="true"></canvas>
    </div>
  </div>
  <canvas id="waveform"></canvas>
  <button id="arrow" type="button" aria-label="Zobrazit zbytek stránky">
    <canvas id="adith" aria-hidden="true"></canvas>
  </button>
</section>

<!-- J-card -->
<section id="jcard">
  <div class="panel-wrap" data-fold="assets/jcard-fold-dark.png">
    <figure class="panel"><img src="assets/art-dark.jpg" alt="Bezedné noci — přední strana"><canvas aria-hidden="true"></canvas></figure>
  </div>
  <div class="panel-wrap" data-fold="assets/jcard-fold-light.png">
    <figure class="panel"><img src="assets/art-light.jpg" alt="Bezedné noci — zadní strana"><canvas aria-hidden="true"></canvas></figure>
  </div>
</section>

<audio id="aud" src="assets/audio.mp3" preload="metadata"></audio>
<script src="dither.js"></script>
<script src="script.js"></script>
</body>
</html>
